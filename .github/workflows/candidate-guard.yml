# Candidate guard (release-flow skill; agent-config docs/release-flow-plan.md, sections 4 and 9). An rc/*
# branch is made only by Candidate, with GITHUB_TOKEN, which starts no workflow: any push that
# creates or updates one is someone else's, and the branch is deleted (Promote checks the head
# against the tag anyway). A deletion is ignored, and the workflows' own deletions start no
# workflow either. There is no candidate/* branch any more: Candidate runs on main (plan 9.1). It checks
# nothing out, so it runs none of the repository's code. It guards against mistakes: a push that changes
# this file runs the changed file.
name: Candidate guard

on:
  push:
    branches: ["rc/**"]

permissions: {}

jobs:
  guard:
    name: rc branch unchanged
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # deleting a branch that broke the rule
    steps:
      - name: Keep the rc branch as Candidate made it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "::error::$GITHUB_REF_NAME is made only by the Candidate workflow, never pushed; it is deleted"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$GITHUB_REF_NAME" > /dev/null || true
          exit 1
