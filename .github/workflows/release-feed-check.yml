name: Release feed

# Watches what the app's update check reads: the newest stable release
# ("latest") and its latest.json. If that breaks, users are not told -- the app
# just finds no update -- so this turns it into a red run (GitHub emails the
# repository owner) instead. See .github/scripts/check-release-feed.sh.
#
# What breaks it: a release made by hand (no latest.json, or a different exe), a
# candidate that is not a prerelease, deleting the newest stable release. Stable
# releases are made by promote.yml only (.claude/rules/release.md).
#
# Runs when a person publishes, edits or deletes a release (releases made by a
# workflow with GITHUB_TOKEN start no workflows; promote.yml checks its own),
# every day, and on demand. A `release` run uses this file as it is at the
# tagged commit, so a hand-made release on an old tag may only be caught by the
# daily run.
on:
  release:
    types: [published, edited, deleted]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: release-feed
  cancel-in-progress: true

permissions: {}

jobs:
  feed:
    name: the update feed works
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/check-release-feed.sh "$REPO"
