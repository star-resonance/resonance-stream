name: Release candidate

# A merge into `rc` builds the app and publishes it as a GitHub *prerelease*
# for testing on Windows: one plain exe (no installer) + SHA256SUMS.txt,
# tagged v<workspace version>-rc.<feature>[.<n>], where <feature> is the
# merged branch's name without its prefix (candidate/main-ui -> main-ui) and
# .<n> counts repeat builds of the same feature. The CI gates must pass before anything is published.
# No real-app smoke test runs here: it is slow and starts only from a pushed release tag (release.yml).
# Only the newest 5 candidate releases (and their tags) are kept.
#
# Prereleases never become "Latest", and the app does not read GitHub
# releases for its update check (it reads the gist), so users never see one.
# A manual run builds the latest merge into rc, or one of the 4 before it (the
# `which` dropdown: GitHub offers fixed options only, so it counts merges
# rather than naming them; the run summary says which PR it took).
# Tag/feature/prune logic: .github/scripts/rc-lib.sh (tests: rc-lib.test.sh).
on:
  push:
    branches: [rc]
  workflow_dispatch:
    inputs:
      which:
        description: 'Which merge into rc to build (default: the latest)'
        type: choice
        required: false
        default: '1 — 가장 최근 머지'
        options:
          - '1 — 가장 최근 머지'
          - '2 — 그 전 머지'
          - '3 — 2개 전 머지'
          - '4 — 3개 전 머지'
          - '5 — 4개 전 머지'
      feature:
        description: 'Feature name for the tag (default: the merged branch, or "build")'
        required: false
        default: ''

# One candidate at a time; a newer merge waits instead of racing for a tag.
concurrency:
  group: release-candidate
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always
  KEEP_CANDIDATES: 5

jobs:
  # The commit to build: rc's newest merge, or the Nth newest (`which`).
  pick:
    name: pick the merge
    if: github.ref == 'refs/heads/rc'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      rank: ${{ steps.pick.outputs.rank }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pick
        id: pick
        env:
          INPUT_WHICH: ${{ inputs.which }}
        run: |
          set -euo pipefail
          source .github/scripts/rc-lib.sh
          rank=$(rc_rank "${INPUT_WHICH:-}")
          sha=$(git rev-list --first-parent -n "$RC_PICK_MAX" "$GITHUB_SHA" | rc_nth_merge "$rank")
          echo "rank=$rank sha=$sha"
          echo "rank=$rank" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # The gates test rc's newest commit; an older merge already passed them in
  # its own pull request, so only the latest one is gated again.
  gates:
    name: gates
    needs: pick
    if: needs.pick.outputs.rank == '1'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: build exe (Windows)
    needs: [pick, gates]
    if: ${{ !cancelled() && needs.pick.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.gates.result) }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Release builds have their own cache, saved from rc only (CI's is a
      # dev-profile cache saved from main).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-candidate
          save-if: ${{ github.ref == 'refs/heads/rc' }}
          cache-bin: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Tailwind + daisyUI for Trunk's pre_build hook (Trunk.toml).
      - run: npm ci
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # beforeBuildCommand runs `trunk build`; --no-bundle: the plain exe only.
      # Release builds embed src-tauri/app.manifest (asks for Administrator).
      # --features test-env: the candidate understands the test flags
      # (--data-dir, --status-file, ... see .memory/roadmap/test-run-parameters.md).
      # release.yml never builds with it.
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --no-bundle --features test-env
      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: target/release/resonance-stream.exe
          if-no-files-found: error
          retention-days: 3

  release:
    name: publish prerelease
    needs: [pick, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the release helpers
        run: bash .github/scripts/rc-lib.test.sh
      - uses: actions/download-artifact@v8
        with:
          name: exe
          path: artifact

      - name: Name the candidate
        id: name
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.pick.outputs.sha }}
          INPUT_FEATURE: ${{ inputs.feature }}
        run: |
          set -euo pipefail
          source .github/scripts/rc-lib.sh
          version=$(rc_version < Cargo.toml)
          # The PR whose merge into rc made this commit (none for a direct push).
          gh api "repos/$REPO/commits/$SHA/pulls" \
            --jq '[.[] | select(.base.ref == "rc" and .merged_at != null)][0] // empty' > pr.json
          branch=$(jq -r '.head.ref // empty' pr.json 2>/dev/null || true)
          feature=$(rc_feature "${INPUT_FEATURE:-$branch}")
          tag=$(git tag -l | rc_tag "$version" "$feature")
          echo "version=$version branch=${branch:-none} tag=$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          {
            echo "### $tag"
            if [ -s pr.json ]; then echo "PR #$(jq -r .number pr.json): $(jq -r .title pr.json)"; fi
            echo "커밋 \`$SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write the release notes
        env:
          TAG: ${{ steps.name.outputs.tag }}
          BRANCH: ${{ steps.name.outputs.branch }}
          SHA: ${{ needs.pick.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source .github/scripts/rc-lib.sh
          exe="Resonance-Stream-$TAG.exe"
          mv artifact/resonance-stream.exe "$exe"
          sha256sum "$exe" > SHA256SUMS.txt
          sum=$(cut -d' ' -f1 SHA256SUMS.txt)
          git fetch -q origin main
          # Backticks in the printf formats are markdown, not substitutions.
          # shellcheck disable=SC2016
          {
            printf '> **테스트용 후보 빌드입니다.** 정식 릴리스가 아니며, 앱의 업데이트 알림에도 나타나지 않습니다.\n\n'
            printf '### 실행 방법\n'
            printf '1. `%s` 를 내려받습니다. 설치는 필요 없습니다.\n' "$exe"
            printf '2. 실행하면 관리자 권한을 요청합니다 (패킷 캡처에 필요) → **예**.\n'
            printf '3. "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행** (코드 서명이 없는 빌드입니다).\n'
            printf '4. 설치된 앱과 같은 설정·번역 모델·채팅 기록 폴더를 함께 씁니다. 두 앱을 동시에 켜지 마세요.\n'
            printf '5. 시험용 옵션을 쓸 수 있는 빌드입니다: 예) `--data-dir C:\\w1\\run1` 로 실행하면 설치된 앱의 폴더 대신 그 폴더를 씁니다. 옵션 없이 실행하면 위 4번과 같습니다.\n\n'
            printf '### 빌드 정보\n'
            printf -- '- 커밋: `%s`\n' "$SHA"
            if [ -n "$BRANCH" ]; then printf -- '- 브랜치: `%s`\n' "$BRANCH"; fi
            printf -- '- CI 실행: %s\n' "$RUN_URL"
            printf -- '- SHA-256: `%s`\n\n' "$sum"
            if [ -s pr.json ]; then
              printf '## 이번 후보: %s (#%s)\n\n' "$(jq -r .title pr.json)" "$(jq -r .number pr.json)"
              jq -r '.body // ""' pr.json
              printf '\n\n'
            fi
            printf '## main 대비 포함된 변경\n'
            git log --no-merges --format='- %s (`%h`)' origin/main.."$SHA" | rc_changes
            printf '\n'
            unverified=$(git log --no-merges --format=%B origin/main.."$SHA" | rc_unverified)
            if [ -n "$unverified" ]; then
              printf '## Windows에서 확인할 것\n'
              printf 'CI와 Linux 세션에서 확인하지 못한 항목입니다 (커밋의 NOT VERIFIED).\n\n'
              printf '%s\n' "$unverified"
            fi
          } > notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          SHA: ${{ needs.pick.outputs.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "Resonance-Stream-$TAG.exe" SHA256SUMS.txt \
            --target "$SHA" --prerelease --latest=false \
            --title "$TAG (테스트용)" --notes-file notes.md

      - name: Keep the newest ${{ env.KEEP_CANDIDATES }} candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/scripts/rc-lib.sh
          gh release list --limit 200 --json tagName,createdAt,isPrerelease \
            --jq '.[] | select(.isPrerelease) | "\(.tagName)\t\(.createdAt)"' \
            | rc_prune "$KEEP_CANDIDATES" \
            | while read -r old; do
                echo "deleting $old"
                gh release delete "$old" --yes --cleanup-tag
              done
