# Candidate (release-flow skill; kade-agent/agent-config docs/release-flow-plan.md, sections 3 to 5a and 9).
# Kade runs this workflow on main (the Actions dropdown has it selected); GITHUB_SHA is the main commit
# at the click. It
#   - refuses unless it runs on refs/heads/main, every check run on that commit passed
#     (scripts/release.py checks-passed), there is a commit since the latest release, the commit is not
#     a candidate yet, and release-notes/v<final>.md passes release_notes_problem,
#   - picks the final version (scripts/release.py next): Cargo.toml's version when it is above the
#     latest final tag, else that tag's next patch (plan 9.2). When it differs from Cargo.toml's,
#     the check job stamps it into Cargo.toml and Cargo.lock (release.py stamp), checks that the lock
#     needs no change, and uploads the stamped files as the artifact stamped-tree; every build below
#     copies them over its checkout,
#   - builds the shipping exe once, with no test flags, signs it with --app-version <version> (the
#     only job that holds the signing secrets) and verifies the signature the way the app will;
#     builds a test-env exe for the real-app smoke test (bridge-smoke.yml) only: it stays a
#     workflow artifact and is in no release,
#   - tags v<final>-rc.N: the main commit itself when nothing was stamped, else a release commit
#     "Release v<final>" whose parent is the main commit, made through the API with the very
#     blobs and tree that were built (the tag job refuses any other); makes a prerelease with the
#     exe, its .sig, SHA256SUMS, latest.json (the candidate-channel feed entry: the same signature,
#     the prerelease's exe URL; try it with --feed-url on a test-env build of your own), makes the
#     branch rc/<rc tag> at the tagged commit for Promote (promote.yml) to run from, and deletes the
#     version's lower rc/ branches.
# The binary carries the final version and never knows it is a candidate. Promote reuses these files.
# A push to main during the run changes nothing: the run keeps its commit. main itself is never
# written. Only the tag job can write, and it runs none of the repository's code.
name: Candidate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check the candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read  # the check runs on HEAD
    outputs:
      final: ${{ steps.version.outputs.final }}
      version: ${{ steps.version.outputs.version }}
      rc: ${{ steps.version.outputs.rc }}
      superseded: ${{ steps.version.outputs.superseded }}
      stamp: ${{ steps.version.outputs.stamp }}
      blob_toml: ${{ steps.version.outputs.blob_toml }}
      blob_lock: ${{ steps.version.outputs.blob_lock }}
      tree: ${{ steps.version.outputs.tree }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Only main is a candidate, and its checks passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/release.py main-only "$GITHUB_REF"
          gh api "repos/$REPO/commits/$GITHUB_SHA/check-runs?per_page=100" \
            | python3 scripts/release.py checks-passed "$GITHUB_RUN_ID"
      - name: The final version, its notes, and the stamped tree
        id: version
        run: |
          set -euo pipefail
          source .github/scripts/release-lib.sh
          final=$(python3 scripts/release.py next)
          version=${final#v}
          notes="release-notes/$final.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes (한국어 릴리스 노트)가 없습니다. release-notes/TEMPLATE.md를 복사해 main에 $notes 로 먼저 올리세요."
            exit 1
          fi
          if ! problem=$(release_notes_problem 12 < "$notes"); then
            echo "::error::$notes: $problem"
            exit 1
          fi
          rc=$(python3 scripts/release.py rc "$final")
          superseded=$(python3 scripts/release.py superseded "$rc")
          # Cargo.toml's version is a floor: stamp the final version when it is another one.
          python3 scripts/release.py stamp "$final"
          stamp=false
          if ! git diff --quiet; then stamp=true; fi
          # The stamped Cargo.lock must need no change, or the build would write another one.
          cargo metadata --locked --format-version 1 > /dev/null
          mkdir stamped
          cp Cargo.toml Cargo.lock stamped/
          git add Cargo.toml Cargo.lock
          {
            echo "This candidate is $rc of $final, at $GITHUB_SHA on main."
            if [ "$stamp" = true ]; then
              echo "Cargo.toml's version is the floor: the release commit stamps $version into Cargo.toml and Cargo.lock."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "final=$final"
            echo "version=$version"
            echo "rc=$rc"
            echo "superseded=$superseded"
            echo "stamp=$stamp"
            echo "blob_toml=$(git rev-parse :Cargo.toml)"
            echo "blob_lock=$(git rev-parse :Cargo.lock)"
            echo "tree=$(git write-tree)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: stamped-tree
          path: |
            stamped/Cargo.toml
            stamped/Cargo.lock
          if-no-files-found: error
          retention-days: 3

  build:
    name: build and sign the exe (Windows)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Cargo.toml's version is a floor: build the tree the tag job will commit, with the final version.
      - uses: actions/download-artifact@v8
        with:
          name: stamped-tree
          path: stamped
      - name: Use the stamped Cargo.toml and Cargo.lock
        shell: bash
        run: cp stamped/Cargo.toml stamped/Cargo.lock .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Tailwind + daisyUI for Trunk's pre_build hook (Trunk.toml).
      - run: npm ci
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # beforeBuildCommand runs `trunk build`; --no-bundle: the plain exe only. No test flags:
      # these are the bytes users get. Release builds embed src-tauri/app.manifest (Administrator).
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
      # The signature is over the exact bytes, so nothing may touch the file after this.
      # --app-version puts the version into the signed comment: the app refuses an exe signed
      # for another version.
      - name: Sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The repository secret TAURI_SIGNING_PRIVATE_KEY is not set."
            exit 1
          fi
          npx --yes @tauri-apps/cli@2 signer sign --app-version "$VERSION" target/release/resonance-stream.exe
          ls -l target/release/resonance-stream.exe target/release/resonance-stream.exe.sig
      # The app's own check on the file about to be published: catches a private key that is not
      # the one whose public half is in the app, and a wrong version.
      - name: Verify the signature the way the app will
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          cargo run --release -p resonance-core --example verify_update -- \
            target/release/resonance-stream.exe target/release/resonance-stream.exe.sig "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: signed-exe
          path: |
            target/release/resonance-stream.exe
            target/release/resonance-stream.exe.sig
          if-no-files-found: error
          retention-days: 3

  testexe:
    name: build the test-env exe (Windows)
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Cargo.toml's version is a floor: build the tree the tag job will commit, with the final version.
      - uses: actions/download-artifact@v8
        with:
          name: stamped-tree
          path: stamped
      - name: Use the stamped Cargo.toml and Cargo.lock
        shell: bash
        run: cp stamped/Cargo.toml stamped/Cargo.lock .
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # --features test-env: the build understands the test flags (--data-dir, --feed-url, ... see
      # .memory/roadmap/test-run-parameters.md). Not signed, never promoted.
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --no-bundle --features test-env
      - uses: actions/upload-artifact@v7
        with:
          name: test-exe
          path: target/release/resonance-stream.exe
          if-no-files-found: error
          retention-days: 3

  # The real app, started on a hosted Windows runner and driven over the test bridge (eight pipelines).
  # A red row stops the tag. The shipped exe has no bridge, so it drives the test-env exe built above.
  smoke:
    name: real-app smoke test
    needs: [check, testexe]
    permissions:
      contents: read
    uses: ./.github/workflows/bridge-smoke.yml
    with:
      exe-artifact: test-exe

  files:
    name: make the release files
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: signed-exe
          path: signed
      - name: SHA256SUMS, the candidate feed entry and the tester notes
        env:
          REPO: ${{ github.repository }}
          FINAL: ${{ needs.check.outputs.final }}
          VERSION: ${{ needs.check.outputs.version }}
          RC: ${{ needs.check.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source .github/scripts/release-lib.sh
          exe=$(release_asset "$FINAL")
          mkdir files
          mv signed/resonance-stream.exe "files/$exe"
          mv signed/resonance-stream.exe.sig "files/$exe.sig"
          (cd files && sha256sum "$exe" "$exe.sig" > SHA256SUMS)
          sum=$(sha256sum "files/$exe" | cut -d' ' -f1)

          # The candidate-channel feed entry: the final version and the signature, the prerelease's exe.
          release_notes_user_part < "release-notes/$FINAL.md" > user-notes.md
          release_manifest "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "https://github.com/$REPO/releases/download/$RC/$exe" "$(cat "files/$exe.sig")" < user-notes.md > files/latest.json
          cat files/latest.json

          prev=$(release_previous_stable_tag "$GITHUB_SHA")
          if [ -n "$prev" ]; then range="$prev..$GITHUB_SHA"; else range="$GITHUB_SHA"; fi
          # Backticks in the printf formats are markdown, not substitutions.
          # shellcheck disable=SC2016
          {
            printf '> **테스트용 후보 빌드입니다.** 정식 릴리스가 아니며, 앱의 업데이트 알림에도 나타나지 않습니다. `%s` 는 정식 릴리스가 될 파일 그대로입니다 (다시 빌드하지 않습니다).\n\n' "$exe"
            printf '### 실행 방법\n'
            printf '1. `%s` 를 내려받습니다. 설치는 필요 없습니다.\n' "$exe"
            printf '2. 실행하면 관리자 권한을 요청합니다 (패킷 캡처에 필요) → **예**.\n'
            printf '3. 설치된 앱과 같은 설정·번역 모델·채팅 기록 폴더를 함께 씁니다. 두 앱을 동시에 켜지 마세요.\n'
            printf '4. `latest.json` 은 이 후보의 업데이트 피드입니다. 시험용 빌드(`--feed-url`)에 지정해 업데이트 경로를 시험합니다.\n\n'
            printf '### 빌드 정보\n'
            printf -- '- main 커밋: `%s`\n' "$GITHUB_SHA"
            printf -- '- 실행: %s\n' "$RUN_URL"
            printf -- '- SHA-256: `%s`\n\n' "$sum"
            printf '## 이번 후보에 들어온 변경\n'
            git log --no-merges --format='- %s (`%h`)' "$range" | rc_changes
            printf '\n'
            unverified=$(git log --no-merges --format=%B "$range" | rc_unverified)
            if [ -n "$unverified" ]; then
              printf '## Windows에서 확인할 것\n'
              printf 'CI와 Linux 세션에서 확인하지 못한 항목입니다 (커밋의 NOT VERIFIED).\n\n'
              printf '%s\n' "$unverified"
            fi
          } > files/notes.md
          cat files/notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: files
          if-no-files-found: error
          retention-days: 3

  tag:
    name: rc tag and prerelease
    needs: [check, files, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # the release commit, the rc tag, the prerelease and the rc branches
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: files
      - uses: actions/download-artifact@v8
        with:
          name: stamped-tree
          path: stamped
      - name: Tag the commit that was built, make the prerelease and the rc/ branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FINAL: ${{ needs.check.outputs.final }}
          RC: ${{ needs.check.outputs.rc }}
          SUPERSEDED: ${{ needs.check.outputs.superseded }}
          STAMP: ${{ needs.check.outputs.stamp }}
          BLOB_TOML: ${{ needs.check.outputs.blob_toml }}
          BLOB_LOCK: ${{ needs.check.outputs.blob_lock }}
          TREE: ${{ needs.check.outputs.tree }}
        run: |
          set -euo pipefail
          exe="Resonance-Stream-$FINAL.exe"
          commit=$GITHUB_SHA
          if [ "$STAMP" = true ]; then
            # The release commit: the main commit plus the two stamped files, nothing else, and only
            # if the blobs and the tree are the ones the check job tested and the build used.
            blob() {
              base64 -w0 "stamped/$1" > "$RUNNER_TEMP/$1.b64"
              jq -n --rawfile content "$RUNNER_TEMP/$1.b64" '{content: $content, encoding: "base64"}' \
                | gh api "repos/$REPO/git/blobs" --input - --jq .sha
            }
            toml=$(blob Cargo.toml)
            lock=$(blob Cargo.lock)
            if [ "$toml" != "$BLOB_TOML" ] || [ "$lock" != "$BLOB_LOCK" ]; then
              echo "::error::the stamped blobs $toml $lock are not the tested $BLOB_TOML $BLOB_LOCK"
              exit 1
            fi
            base=$(gh api "repos/$REPO/git/commits/$GITHUB_SHA" --jq .tree.sha)
            tree=$(jq -n --arg base "$base" --arg toml "$toml" --arg lock "$lock" \
                     '{base_tree: $base, tree: [
                        {path: "Cargo.toml", mode: "100644", type: "blob", sha: $toml},
                        {path: "Cargo.lock", mode: "100644", type: "blob", sha: $lock}]}' \
                   | gh api "repos/$REPO/git/trees" --input - --jq .sha)
            if [ "$tree" != "$TREE" ]; then
              echo "::error::the tree $tree is not the tested $TREE"
              exit 1
            fi
            commit=$(jq -n --arg msg "Release $FINAL" --arg tree "$tree" --arg parent "$GITHUB_SHA" \
                       '{message: $msg, tree: $tree, parents: [$parent]}' \
                     | gh api "repos/$REPO/git/commits" --input - --jq .sha)
          fi
          object=$(jq -n --arg tag "$RC" --arg sha "$commit" \
                     '{tag: $tag, message: $tag, object: $sha, type: "commit"}' \
                   | gh api "repos/$REPO/git/tags" --input - --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$RC" -f sha="$object" > /dev/null
          cd files
          gh release create "$RC" "$exe" "$exe.sig" SHA256SUMS latest.json \
            --repo "$REPO" --verify-tag --prerelease --latest=false --title "$RC (테스트용)" --notes-file notes.md
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/rc/$RC" -f sha="$commit" > /dev/null
          for b in $SUPERSEDED; do
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b" > /dev/null || echo "::warning::could not delete $b"
          done
          {
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Candidate $RC at $commit (on main)."
            else
              echo "Candidate $RC at $commit (release commit; parent $GITHUB_SHA on main)."
            fi
            if [ -n "$SUPERSEDED" ]; then echo "Deleted the superseded $SUPERSEDED."; fi
            echo "Try the prerelease, then Actions > Promote > Run workflow > branch rc/$RC."
          } >> "$GITHUB_STEP_SUMMARY"
