# Merges a green pull request from a `claude/*` branch into main, then deletes the branch.
# Runs when any check below finishes; star-resonance/.github's reusable workflow merges only when
# every check on the PR's head commit is green and every check in `require:` has succeeded, so a
# check whose workflow has not started yet is never skipped. It also closes the issues the PR
# says it closes (`Closes #N`), which a merge made with GITHUB_TOKEN does not do.
# Left for a person: a PR into any branch but main, another branch
# prefix, a fork, a draft, and a PR that touches .github/workflows/ (this file included) or a
# `protected:` path, the agent rules.
# Add each new PR check's workflow name to `workflows:`, and its check names to `require:` if
# they run on every pull request into main: a path-filtered check never reports on most PRs,
# and naming one would leave every other PR waiting. `actionlint` and `Dependency audit` are
# path-filtered, so they are triggers only. A renamed check changes here in the same PR.
# `workflow_run` is read from main: a change to this file acts only after its own merge.
name: Auto-merge

on:
  workflow_run:
    workflows: ["CI", "Test branch guard", "Line endings", "CLAUDE.md check", "actionlint", "Dependency audit"]
    types: [completed]

permissions: {}

jobs:
  merge:
    uses: star-resonance/.github/.github/workflows/auto-merge.yml@main
    with:
      require: |
        core + ui gates (Linux)
        app gate (Windows)
        secret scan (gitleaks)
        no test/* branch into main
        eol / LF line endings
        check / CLAUDE.md and rules within limits
      protected: |
        CLAUDE.md
        .claude/rules/
    permissions:
      contents: write
      pull-requests: write
      issues: write  # close the issues a merged PR says it closes
      checks: read
      statuses: read

  # A merge made with GITHUB_TOKEN starts no push run on main, so main's build cache would go
  # stale. workflow_dispatch is the one event GITHUB_TOKEN may start; the run on main re-saves
  # the cache.
  refresh:
    name: run CI on main after the merge
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write  # dispatch CI on main
    steps:
      - name: Dispatch CI on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run ci.yml --repo "$REPO" --ref main
