name: Release

# A stable release (D-30, the global release flow):
# the version bump and release notes go to main in a PR, a PR from main into
# `rc` is merged (release-checks.yml checks it; the merge builds a candidate exe
# for a Windows test), then Kade starts this workflow by hand on `rc`
# (Actions > Release > Run workflow > branch rc). It releases the head commit
# of rc only if that commit is the merge of a PR from main into rc, its tree is
# that PR's head tree, it carries no v* tag yet, and Cargo.toml's
# [workspace.package] version is new (release_new_version_problem). The tag
# v<version> is created by this workflow (annotated, on that rc commit) when it
# publishes; nobody pushes it by hand. It builds the plain exe, signs it, and
# publishes a GitHub release with three assets:
#   Resonance-Stream-v<x>.exe        the app (portable, no installer)
#   Resonance-Stream-v<x>.exe.sig    its minisign signature -- the app installs
#                                    an update only if this verifies against a
#                                    key built into the app, for version <x>
#   latest.json                      the update feed: version, notes, url, signature
# (releases/latest/download/latest.json always serves the newest stable one;
# candidates are prereleases and never become "latest").
#
# ONE-TIME SETUP (repository secrets, Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the *contents* of the primary private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
# The private keys are never in the repo; their public halves are
# TRUSTED_UPDATE_KEYS in crates/core/src/update_signature.rs. The backup key
# stays offline -- it is only ever used to sign a release by hand if the
# primary key is lost or leaked.
#
# A failed run before the publish job changes nothing: run it on rc again. A
# commit that already carries a v* tag is refused, so after a half-made release
# delete that release and its tag first.
# The workflow is read from rc, so a change to it acts from the release after the
# merge into rc that carries it.
# Tag / feed logic: .github/scripts/release-lib.sh (tests: release-lib.test.sh).
# Release notes: release-notes/v<x>.md (copy release-notes/TEMPLATE.md), merged to
# main with the version bump -- a short Korean summary for users (the update
# dialog, top of the release page) and, below "## 개발자용 상세", detail for
# maintainers (a collapsed block of the release page). The first job refuses a
# release without it (release-checks.yml already did on the PR into rc).
# After publishing, the live feed is read the way the app reads it
# (.github/scripts/check-release-feed.sh); release-feed-check.yml keeps watching it.
on:
  workflow_dispatch:

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  # May rc's head become a release? Cheap, so it runs before the gates.
  check:
    name: check the rc commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read  # the PR from main merged as the rc commit
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/rc ]; then
            echo "::error::A release is made from rc only (D-30): Actions > Release > Run workflow > branch rc. This run is on $GITHUB_REF."
            exit 1
          fi
          bash .github/scripts/release-lib.test.sh
          source .github/scripts/release-lib.sh
          source .github/scripts/rc-lib.sh
          commit=$GITHUB_SHA
          released=$(git tag --points-at "$commit" --list 'v*')
          if [ -n "$released" ]; then
            echo "::error::$commit is already released: $released"
            exit 1
          fi
          pr=$(gh api "repos/$GH_REPO/commits/$commit/pulls" --jq \
                 "[.[] | select(.base.ref == \"rc\" and .head.ref == \"main\" and .merge_commit_sha == \"$commit\")][0] // empty")
          if [ -z "$pr" ]; then
            echo "::error::rc's head $commit is not the merge of a pull request from main into rc (D-30). Open one and merge it first."
            exit 1
          fi
          head=$(jq -r .head.sha <<<"$pr")
          if [ "$(git rev-parse "$commit^{tree}")" != "$(git rev-parse "$head^{tree}")" ]; then
            echo "::error::rc at $commit differs from $head, the tested head of $(jq -r .html_url <<<"$pr")."
            exit 1
          fi
          version=$(rc_version < Cargo.toml)
          if ! problem=$(git tag --list 'v*' | release_new_version_problem "$version"); then
            echo "::error::$problem"
            exit 1
          fi
          TAG="v$version"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already has a release."
            exit 1
          fi
          notes="release-notes/$TAG.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes (한국어 릴리스 노트)가 없습니다. release-notes/TEMPLATE.md를 복사해 쓰고 main에 올린 뒤 rc로 다시 머지하세요."
            exit 1
          fi
          if ! problem=$(release_notes_problem 12 < "$notes"); then
            echo "::error::$notes: $problem"
            exit 1
          fi
          echo "Releasing $TAG from rc at $commit ($(jq -r .html_url <<<"$pr"))." >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  gates:
    name: gates
    needs: check
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: build + sign the exe (Windows)
    needs: [check, gates]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # No build cache: a release builds clean from rc's commit. A release is rare.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Tailwind + daisyUI for Trunk's pre_build hook (Trunk.toml).
      - run: npm ci
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # beforeBuildCommand runs `trunk build`; --no-bundle: the plain exe only.
      # Release builds embed src-tauri/app.manifest (asks for Administrator).
      - name: Build
        run: npx --yes @tauri-apps/cli@2 build --no-bundle

      # Sign the finished exe -- the signature is over its exact bytes, so
      # nothing may touch the file after this. --app-version puts the version
      # into the signed comment: the app refuses an exe signed for another
      # version (an old signed build passed off as the new release).
      - name: Sign
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The repository secret TAURI_SIGNING_PRIVATE_KEY is not set (see the header of release.yml)."
            exit 1
          fi
          npx --yes @tauri-apps/cli@2 signer sign --app-version "$VERSION" target/release/resonance-stream.exe
          ls -l target/release/resonance-stream.exe target/release/resonance-stream.exe.sig

      # The app's own check, on the file about to be published: catches a
      # private key that is not the one whose public half is in the app, and
      # a wrong version, before anyone downloads the release.
      - name: Verify the signature the way the app will
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          cargo run --release -p resonance-core --example verify_update -- \
            target/release/resonance-stream.exe target/release/resonance-stream.exe.sig "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: signed-exe
          path: |
            target/release/resonance-stream.exe
            target/release/resonance-stream.exe.sig
          if-no-files-found: error
          retention-days: 3

  # The real app, started on a hosted Windows runner and driven over the test bridge (eight pipelines, bridge-smoke.yml).
  # The shipped exe has no test bridge, so this builds a separate exe with the test flags from the same commit (see bridge-smoke.yml), in parallel with the signed build.
  # A red row stops the publish; run the workflow on rc again after a fix or a runner hiccup.
  smoke:
    name: real-app smoke test
    needs: [check, gates]
    permissions:
      contents: read
    uses: ./.github/workflows/bridge-smoke.yml

  release:
    name: publish the release
    needs: [check, build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: signed-exe
          path: artifact

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          source .github/scripts/release-lib.sh
          exe=$(release_asset "$TAG")
          mv artifact/resonance-stream.exe "$exe"
          mv artifact/resonance-stream.exe.sig "$exe.sig"
          sha256sum "$exe" > SHA256SUMS.txt

          # Notes (release-notes/<tag>.md, checked in the first job): users get the
          # Korean summary -- in the app's update dialog (latest.json) and at the top
          # of the release page; maintainers get the detail and the commits since the
          # previous stable release in one collapsed block of the release page.
          notes_src="release-notes/$TAG.md"
          release_notes_user_part < "$notes_src" > notes.md
          prev=$(release_previous_stable_tag "$GITHUB_SHA")
          if [ -n "$prev" ]; then
            git log --no-merges --format='- %s' "$prev..$GITHUB_SHA" > commits.md
          else
            git log --no-merges --format='- %s' -n 30 "$GITHUB_SHA" > commits.md
          fi
          release_page_body commits.md < "$notes_src" > body.md

          release_manifest "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "$(release_download_url "$REPO" "$TAG")" "$(cat "$exe.sig")" < notes.md > latest.json
          cat latest.json

          # The tag: an annotated tag object on the rc commit this run checked,
          # then its ref (`gh release create` alone would make a lightweight tag).
          object=$(gh api "repos/$REPO/git/tags" -f tag="$TAG" -f message="$TAG" \
                     -f object="$GITHUB_SHA" -f type=commit --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$object" > /dev/null
          gh release create "$TAG" "$exe" "$exe.sig" latest.json SHA256SUMS.txt \
            --verify-tag --latest --title "$TAG" --notes-file body.md

      # A broken feed is silent for users -- the app just finds "no update" --
      # so read it back as the app does: "latest" must be this release and its
      # latest.json must hold up.
      - name: Check the live update feed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: bash .github/scripts/check-release-feed.sh "$REPO" "$TAG"
