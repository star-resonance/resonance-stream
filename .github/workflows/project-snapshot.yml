# Exports the Resonance organization Project to STATUS.md on the `status` branch
# (star-resonance). Cloud sessions cannot reach the Project API; they read this file instead:
#   git fetch origin status && git show origin/status:STATUS.md
# The job is star-resonance/.github's reusable project-snapshot.yml; this file only says when it
# runs: three times a day, and on demand (workflow_dispatch) when a session needs fresh state.
name: Project snapshot

on:
  schedule:
    - cron: "17 0,6,12 * * *"  # 09:17, 15:17, 21:17 KST
  workflow_dispatch:

permissions: {}

jobs:
  snapshot:
    if: vars.PROJECT_NUMBER != ''  # dormant until the Project is set up
    permissions:
      contents: write  # push the generated `status` branch
    uses: star-resonance/.github/.github/workflows/project-snapshot.yml@main
    secrets:
      BRIDGE_APP_PRIVATE_KEY: ${{ secrets.BRIDGE_APP_PRIVATE_KEY }}
