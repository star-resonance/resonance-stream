name: CI

# Branch pushes are covered by their pull_request run; push only runs on main.
# Pull requests always run: auto-merge.yml merges on a green run, so a
# docs-only PR must produce one too. Pushes to main skip non-source changes.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.memory/**'
      - 'LICENSE*'
  pull_request:
  # auto-merge.yml dispatches this on main after each merge (merges made with
  # GITHUB_TOKEN start no push run), so main's build cache stays current.
  workflow_dispatch:
  # release-candidate.yml runs these gates before it builds a candidate exe.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  # Line tables only: the gate needs test results, not debugger symbols. Much
  # smaller PDBs on Windows -- faster linking, a smaller build cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# Build cache policy (both jobs): every run restores, only main saves. A cache
# saved by a PR ref is readable by that PR alone and counts against the repo's
# 10 GB limit, so PR saves cost time and evict main's entry, which every PR
# restores from.

permissions: {}

jobs:
  ui:
    name: core + ui gates (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
      - uses: extractions/setup-just@v2
      - run: just fmt-check
      - run: just core-check
      - run: just ui-check
      - name: release-candidate helpers
        run: bash .github/scripts/rc-lib.test.sh
      - name: stable-release helpers
        run: bash .github/scripts/release-lib.test.sh
      - name: signed-metadata helpers
        run: bash .github/scripts/metadata-lib.test.sh
      - name: test-branch guard helper
        run: bash .github/scripts/branch-guard.test.sh
      - name: MEMORY.md size (index of 40 lines and 6 KB, 200 characters a line)
        run: |
          bash .github/scripts/memory-check.test.sh
          bash .github/scripts/memory-check.sh
      - name: CLAUDE.md and rules size (100 lines; rules 80 lines with paths:)
        run: |
          bash .github/scripts/claude-md-check.test.sh
          bash .github/scripts/claude-md-check.sh

  app:
    name: app gate (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-bin: false
      - uses: extractions/setup-just@v2
      # tauri::generate_context! needs frontendDist to exist; the gate checks
      # the backend, so a placeholder stands in for `trunk build`.
      - name: Placeholder frontend dist
        shell: bash
        run: mkdir -p dist && echo '<!doctype html>' > dist/index.html
      - run: just app-check
