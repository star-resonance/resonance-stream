# Auto-candidate (release-flow skill; kade-agent/agent-config docs/release-flow-plan.md, section 4a).
# Once a workflow that checks main has finished, this pushes candidate/<12-character sha> at that
# commit when every check run on it has finished and passed and its version is unreleased
# (scripts/release.py should-candidate), so no agent has to push the branch by hand. Kade still
# starts Candidate and Promote.
#   - The trigger is every workflow that runs on main and posts check runs Candidate reads
#     (ci.yml, claude-md-check.yml, eol-check.yml); the last one to finish finds the others done
#     and decides. Checks still running: nothing is pushed, a later completion decides.
#     metadata.yml runs on metadata-v* tags only, so it is not in the list.
#   - Auto-merge dispatches CI on main after each merge (a merge with GITHUB_TOKEN starts no push
#     run), so a push and a workflow_dispatch run both count; head_branch main limits the rest.
#   - Only the newest main is a candidate: a run whose commit is no longer main's head does nothing,
#     and an unused candidate branch at an older commit is deleted first (Kade, 2026-10-23).
#   - While Candidate is running or queued it pushes nothing and fails, so the branch Candidate
#     reads is never deleted under it; an agent pushes the branch by hand afterwards. That failure
#     is the only one: it is when Kade asks an agent to push by hand.
# The branch is created with GITHUB_TOKEN, which starts no workflow, so candidate-guard does not run
# on it; Candidate checks the name, main, the head and the checks again. This workflow's own jobs
# are left out of checks-passed (scripts/release.py CANDIDATE_JOBS). Only the push job can write,
# and it checks nothing out.
name: Auto-candidate

on:
  workflow_run:
    workflows: ["CI", "CLAUDE.md check", "Line endings"]
    types: [completed]
    branches: [main]

permissions: {}

# Its own group, never `release`: a queued run there would cancel Kade's queued Candidate.
concurrency:
  group: auto-candidate
  cancel-in-progress: false

jobs:
  decide:
    name: decide on a candidate
    if: github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read  # the check runs on the commit
    outputs:
      push: ${{ steps.decide.outputs.push }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The version is new with release notes, and every check on the commit passed
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          no() {
            echo "$1" >> "$GITHUB_STEP_SUMMARY"
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$(python3 scripts/release.py should-candidate 2> "$RUNNER_TEMP/reason")" != true ]; then
            no "No candidate at $SHA: $(sed 's/^release: //' "$RUNNER_TEMP/reason")"
          fi
          source .github/scripts/release-lib.sh
          notes="release-notes/$(python3 scripts/release.py next).md"
          if ! problem=$(release_notes_problem 12 < "$notes"); then
            no "No candidate at $SHA: $notes: $problem"
          fi
          gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" > "$RUNNER_TEMP/runs.json"
          if ! why=$(python3 scripts/release.py checks-passed "$GITHUB_RUN_ID" < "$RUNNER_TEMP/runs.json" 2>&1); then
            if grep -qE ': (failure|timed_out|cancelled|action_required|stale|startup_failure)(;|$)' <<< "$why"; then
              no "main is red at $SHA: no candidate. ${why#release: }"
            fi
            no "Checks are still running at $SHA; a later workflow's completion decides. ${why#release: }"
          fi
          echo "Every check on $SHA passed and its version is unreleased with release notes: push the candidate branch." >> "$GITHUB_STEP_SUMMARY"
          echo "push=true" >> "$GITHUB_OUTPUT"

  push:
    name: push the candidate branch
    needs: decide
    if: needs.decide.outputs.push == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # creating the candidate branch, deleting an unused one
      actions: read    # whether Candidate is running
    steps:
      - name: Push candidate/<sha> at main, replacing an unused candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          branch="candidate/${SHA:0:12}"
          main=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          if [ "$main" != "$SHA" ]; then
            echo "main has moved on to $main; a later workflow's completion decides on a candidate." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          running=$(gh api "repos/$REPO/actions/workflows/candidate.yml/runs?per_page=20" \
            --jq '[.workflow_runs[] | select(.status != "completed")] | length')
          if [ "$running" != 0 ]; then
            echo "::error::Candidate is running; once it has finished, push $branch by hand (release-flow, step 2)"
            exit 1
          fi
          exists=false
          for ref in $(gh api "repos/$REPO/git/matching-refs/heads/candidate/" --jq '.[].ref'); do
            old=${ref#refs/heads/}
            if [ "$old" = "$branch" ]; then exists=true; continue; fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$old" > /dev/null
            echo "Deleted the unused $old." >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$exists" = false ]; then
            gh api -X POST "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$SHA" > /dev/null
          fi
          echo "Ready: Actions > Candidate > Run workflow > branch \`$branch\`." >> "$GITHUB_STEP_SUMMARY"
