[package]
name = "resonance-stream"
version.workspace = true
authors = ["Enjay27 <kdkm2002@gmail.com>"]
description = "Blue Protocol: Star Resonance Real-time Translator"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Honour the test flags (--data-dir, --status-file, ...; see
# `.memory/roadmap/test-run-parameters.md`) in a release build, and carry the test
# bridge (`bridge/`, with its MQTT client). Debug builds honour the flags without it
# but need the feature for the bridge. Only release candidates are built with it;
# stable releases never.
test-env = ["dep:rumqttc"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "resonance_stream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
resonance-core = { path = "../crates/core" }
resonance-llama = { path = "../crates/llama" }
resonance-types = { path = "../crates/types" }
tauri = { version = "2", features = ["unstable", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Test bridge client (loopback MQTT, see `bridge/`), only with the `test-env` feature; no TLS: it never leaves the machine.
rumqttc = { version = "0.25", default-features = false, optional = true }
reqwest = { version = "0.12", features = ["stream", "json", "blocking", "rustls-tls"] }
futures-util = "0.3"
# Per-chunk download timeouts; the bridge's command queue (already in the tree through reqwest and tauri).
tokio = { version = "1", default-features = false, features = ["time", "sync"] }
tauri-plugin-fs = "2.4.5" # For handling the download stream
# Network & Parsing
is_elevated = "0.1"
crossbeam-channel = "0.5"    # Blazing fast thread queues
parking_lot = "0.12"         # Mutex/RwLock without poisoning

chrono = "0.4.43"
local-ip-address = "0.6.10"
lazy_static = "1.5.0"
# Features are also switched on by other crates (socket2: WinSock); the
# ones this crate calls directly are listed.
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock", "Win32_UI_Input_KeyboardAndMouse"] }
socket2 = "0.6.2"
log = "0.4.29"
env_logger = "0.11"
zip = "9.0.1"
serde_with = "3.17.0"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2.4.1"

[dev-dependencies]
serde_json = "1.0"
