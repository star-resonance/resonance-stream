[package]
name = "resonance-stream-ui"
version.workspace = true
authors = ["Enjay27 <kdkm2002@gmail.com>"]
description = "Blue Protocol: Star Resonance Real-time Translator"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
resonance-types = { path = "crates/types" }
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1.7"
futures = "0.3"
serde_json = "1.0.149"
web-sys = { version = "0.3.85", features = ["Window", "Navigator", "Clipboard", "Selection", "HtmlAudioElement", "HtmlMediaElement",] }
gloo-timers = { version = "0.4.0", features = ["futures"] }
chrono = "0.4.44"

[workspace]
members = ["src-tauri", "crates/core", "crates/llama", "crates/types"]

# The one place the app version is set. src-tauri inherits it, and
# tauri.conf.json has no "version", so Tauri falls back to src-tauri's.
[workspace.package]
version = "0.6.2"

# Profiles only take effect here, at the workspace root (cargo ignored them
# in src-tauri/Cargo.toml). They apply to every release build, the wasm UI
# included.
[profile.release]
panic = "abort"      # 패닉 시 스택 추적을 생략하여 용량 감소
codegen-units = 1    # 컴파일 단위를 하나로 합쳐 최적화 극대화
lto = true           # Link Time Optimization 활성화
opt-level = "s"      # 실행 파일 크기 최적화 (z도 가능)
strip = true         # 바이너리 내 디버그 심볼 강제 제거

# The capture and text hot path: speed over size.
[profile.release.package.resonance-core]
opt-level = 3
