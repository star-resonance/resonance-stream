[package]
name = "resonance-llama"
version.workspace = true
authors = ["Enjay27 <kdkm2002@gmail.com>"]
description = "HTTP client for the local llama.cpp server (llama-server) of Resonance Stream"
edition = "2021"
publish = false

[dependencies]
resonance-core = { path = "../core" }
# Same version as the app's, so it is built once. The server is on 127.0.0.1:
# plain HTTP, no TLS backend needed here.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
serde_json = "1"

[dev-dependencies]
etherparse = "0.19.0"
ruzstd = "0.9.1"
resonance-types = { path = "../types" }
