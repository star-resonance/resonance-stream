[package]
name = "resonance-core"
version.workspace = true
authors = ["Enjay27 <kdkm2002@gmail.com>"]
description = "Platform-independent capture, protocol and text logic for Resonance Stream"
edition = "2021"
publish = false

[dependencies]
resonance-types = { path = "../types" }
chrono = { version = "0.4.43", default-features = false }
etherparse = "0.19.0"
kakasi = "0.1.0"
lazy_static = "1.5.0"
# IPADIC is embedded in the binary; its build script downloads the dictionary
# (Lindera.dev) on the first build.
lindera = { version = "6.2.0", default-features = false, features = ["embed-ipadic"] }
log = "0.4.29"
regex = "1.12.3"
semver = "1"
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.2"
sha2 = "0.10"
ruzstd = "0.9.1"

[dev-dependencies]
insta = "1.49.0"
# Property tests: tests/properties.rs
proptest = "1"
